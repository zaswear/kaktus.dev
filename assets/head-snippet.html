     kaktus.dev — favicon & brand meta. Paste inside <head>.

<!-- Primary favicons -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="shortcut icon" href="/assets/favicon-48x48.png">

<!-- Apple / iOS -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#3DDC84">

<!-- PWA / Android -->
<link rel="manifest" href="/assets/site.webmanifest">
<meta name="theme-color" content="#0B0F14">

<!-- Windows tiles -->
<meta name="msapplication-TileColor" content="#0B0F14">
